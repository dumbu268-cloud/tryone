<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440">
  <defs>
    <!-- Base fabric shading: lighter at the chest, darker toward the hem. -->
    <linearGradient id="fabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6485c6" />
      <stop offset="0.55" stop-color="#4f72b4" />
      <stop offset="1" stop-color="#3d5c96" />
    </linearGradient>
    <!-- Volume: a soft highlight in the chest centre fading to shaded edges. -->
    <radialGradient id="volume" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.22" />
    </radialGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="rightShade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22" />
      <stop offset="1" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Shared t-shirt silhouette. -->
    <path id="tee" d="
      M168,84
      L108,104
      L74,182
      Q104,188 138,190
      L120,420
      Q200,436 280,420
      L262,190
      Q296,188 326,182
      L292,104
      L232,84
      Q200,112 168,84
      Z" />
  </defs>

  <!-- Body -->
  <use href="#tee" fill="url(#fabric)" />
  <!-- Volume shading -->
  <use href="#tee" fill="url(#volume)" />
  <!-- Side shading (clipped to the silhouette) -->
  <clipPath id="clip"><use href="#tee" /></clipPath>
  <g clip-path="url(#clip)">
    <rect x="0" y="0" width="150" height="440" fill="url(#leftShade)" />
    <rect x="250" y="0" width="150" height="440" fill="url(#rightShade)" />
    <!-- Armpit sleeve shadows -->
    <ellipse cx="150" cy="196" rx="40" ry="22" fill="#000000" opacity="0.12" />
    <ellipse cx="250" cy="196" rx="40" ry="22" fill="#000000" opacity="0.12" />
    <!-- Subtle hem shadow -->
    <rect x="0" y="398" width="400" height="42" fill="#000000" opacity="0.10" />
  </g>

  <!-- Collar ribbing -->
  <path d="M168,84 Q200,112 232,84" fill="none" stroke="#2f4a7d" stroke-width="7"
        stroke-linecap="round" />
  <path d="M171,80 Q200,106 229,80" fill="none" stroke="#86a2d6" stroke-width="2.5"
        stroke-linecap="round" opacity="0.8" />

  <!-- Faint outline to seat the garment against the body -->
  <use href="#tee" fill="none" stroke="#2b3f66" stroke-width="2" stroke-opacity="0.35" />
</svg>
