<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440">
  <defs>
    <linearGradient id="teeFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6485c6" />
      <stop offset="0.55" stop-color="#4f72b4" />
      <stop offset="1" stop-color="#3d5c96" />
    </linearGradient>
    <linearGradient id="teeSleeveL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#5578b8" />
      <stop offset="1" stop-color="#4a6aa6" />
    </linearGradient>
    <linearGradient id="teeSleeveR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5578b8" />
      <stop offset="1" stop-color="#4a6aa6" />
    </linearGradient>
    <radialGradient id="teeVolume" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.13" />
    </radialGradient>
  </defs>

  <!-- Short sleeves -->
  <polygon points="120,100 60,112 66,195 120,185" fill="url(#teeSleeveL)" />
  <polygon points="280,100 340,112 334,195 280,185" fill="url(#teeSleeveR)" />
  <line x1="60" y1="112" x2="66" y2="195" stroke="#33517f" stroke-width="6" stroke-linecap="round" />
  <line x1="340" y1="112" x2="334" y2="195" stroke="#33517f" stroke-width="6" stroke-linecap="round" />

  <!-- Torso -->
  <path d="M120,100 L168,100 Q200,126 232,100 L280,100 L280,420 Q200,432 120,420 Z"
        fill="url(#teeFabric)" />
  <path d="M120,100 L168,100 Q200,126 232,100 L280,100 L280,420 Q200,432 120,420 Z"
        fill="url(#teeVolume)" />

  <!-- Collar ribbing -->
  <path d="M168,100 Q200,126 232,100" fill="none" stroke="#2f4a7d" stroke-width="7"
        stroke-linecap="round" />
  <path d="M171,96 Q200,120 229,96" fill="none" stroke="#86a2d6" stroke-width="2.5"
        stroke-linecap="round" opacity="0.8" />

  <path d="M120,100 L120,420" fill="none" stroke="#000000" stroke-width="10" opacity="0.06" />
  <path d="M280,100 L280,420" fill="none" stroke="#000000" stroke-width="10" opacity="0.06" />
</svg>
