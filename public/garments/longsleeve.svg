<svg xmlns="http://www.w3.org/2000/svg" width="520" height="460" viewBox="0 0 520 460">
  <defs>
    <linearGradient id="lsFabric" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9683" />
      <stop offset="0.55" stop-color="#3f7d6a" />
      <stop offset="1" stop-color="#335f52" />
    </linearGradient>
    <linearGradient id="lsSleeveL" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#447f6e" />
      <stop offset="1" stop-color="#39705f" />
    </linearGradient>
    <linearGradient id="lsSleeveR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#447f6e" />
      <stop offset="1" stop-color="#39705f" />
    </linearGradient>
    <radialGradient id="lsVolume" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.14" />
    </radialGradient>
  </defs>

  <!-- Sleeves (drawn first so the torso overlaps the armhole seam) -->
  <polygon points="185,120 41,317 81,349 185,235" fill="url(#lsSleeveL)" />
  <polygon points="335,120 479,317 439,349 335,235" fill="url(#lsSleeveR)" />
  <!-- Cuff ribbing -->
  <line x1="41" y1="317" x2="81" y2="349" stroke="#2b4e43" stroke-width="7" stroke-linecap="round" />
  <line x1="479" y1="317" x2="439" y2="349" stroke="#2b4e43" stroke-width="7" stroke-linecap="round" />

  <!-- Torso -->
  <path d="M185,120 L245,120 Q260,148 275,120 L335,120 L335,345 Q260,357 185,345 Z"
        fill="url(#lsFabric)" />
  <path d="M185,120 L245,120 Q260,148 275,120 L335,120 L335,345 Q260,357 185,345 Z"
        fill="url(#lsVolume)" />

  <!-- Collar -->
  <path d="M245,120 Q260,148 275,120" fill="none" stroke="#294c41" stroke-width="8"
        stroke-linecap="round" />
  <path d="M247,116 Q260,142 273,116" fill="none" stroke="#7fb3a3" stroke-width="2.5"
        stroke-linecap="round" opacity="0.8" />

  <!-- Soft side shading -->
  <path d="M185,120 L185,345" fill="none" stroke="#000000" stroke-width="10" opacity="0.06" />
  <path d="M335,120 L335,345" fill="none" stroke="#000000" stroke-width="10" opacity="0.06" />
</svg>
